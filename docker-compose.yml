name: anngan-studio

x-backend: &backend
  build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
  image: anngan/studio-backend:2.0.0
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anngan}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@postgres:5432/${POSTGRES_DB:-anngan_studio}
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-anngan}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?đặt MINIO_ROOT_PASSWORD trong .env}
  volumes: [backend_var:/srv/var]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anngan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-anngan_studio}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anngan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?đặt MINIO_ROOT_PASSWORD trong .env}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: anngan/studio-web:2.0.0
    environment:
      API_PUBLIC_URL: ""
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes: ["./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on: [api, web]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.1
    profiles: ["monitoring"]
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  backend_var: {}
