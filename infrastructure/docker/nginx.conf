# Gateway cùng origin: / → web, /api /health /metrics /docs → api. Cookie phiên dùng chung domain.
upstream web { server web:3000; }
upstream api { server api:8000; }
server {
  listen 80;
  client_max_body_size 600m;
  proxy_read_timeout 600s;
  add_header X-Content-Type-Options nosniff;
  location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ ^/(health|docs|openapi.json) { proxy_pass http://api; }
  location /metrics { allow 172.16.0.0/12; deny all; proxy_pass http://api; }
  location / { proxy_pass http://web; proxy_set_header Host $host; }
}
